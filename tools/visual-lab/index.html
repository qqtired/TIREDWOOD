<!doctype html><html lang="ru"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Game Opus · визуальный стенд</title>
<style>body{margin:0;background:#172a31;color:#f5ead7;font:14px system-ui}canvas{position:fixed;inset:0;width:100%;height:100%}nav{position:fixed;z-index:2;left:16px;top:14px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;max-width:calc(100% - 32px);padding:8px;background:#20333bee;border-radius:10px}button,select{font:inherit;color:inherit;background:#344951;border:1px solid #70868a;border-radius:6px;padding:8px;cursor:pointer}button[aria-pressed=true]{background:#c5924c;color:#101d24}button:focus-visible,select:focus-visible{outline:3px solid #f4c573;outline-offset:2px}#note{position:fixed;bottom:14px;left:16px;z-index:2;padding:9px 12px;border-radius:8px;background:#20333bee;pointer-events:none;line-height:1.5}strong{margin:0 10px}#error{position:fixed;z-index:5;bottom:55px;color:#ffd4be;background:#552820;white-space:pre-wrap}</style>
