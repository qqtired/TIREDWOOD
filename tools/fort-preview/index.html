<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Крепость — контролируемое превью босса</title>
    <style>
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
      #game { width: 100vw; height: 100vh; display: block; }
      #qa { position: fixed; z-index: 40; right: 16px; bottom: 16px; width: min(350px, calc(100vw - 32px)); max-height: 55vh; overflow: auto; padding: 16px; background: rgba(24, 20, 28, .94); border: 1px solid #8b719c; border-radius: 12px; color: #fff5e5; font: 14px/1.4 Rubik, system-ui, sans-serif; }
      #qa p { margin: 8px 0 12px; color: #dfcce7; }
      #qa label { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 8px 0; }
      #qa select, #qa button { min-height: 36px; padding: 5px 8px; border: 1px solid #9473a2; border-radius: 5px; color: #fff5e5; background: #42304e; font: inherit; }
      #qa select { max-width: 230px; }
      #qa button { margin-right: 8px; cursor: pointer; }
      #qa :focus-visible { outline: 3px solid #7ffff4; outline-offset: 3px; }
      #metrics { display: block; white-space: pre-wrap; color: #d1efea; font-size: 12px; margin-top: 12px; }
    </style>
  </head>
  <body>
    <canvas id="game" aria-label="Крепость и тестовые снимки босса"></canvas>
    <div id="hud" class="hud"></div>
    <aside id="qa" aria-label="Управление контролируемым превью">
      <b>Контролируемое превью Fortress</b>
      <p>Настоящие мир, модели и HUD; заданные снимки. Это визуальная проверка, полную игру и серверные покупки проверяют отдельно. Мышью можно вращать камеру, колесом — приближать.</p>
      <label>Состояние <select id="attack"><option value="gate">Замах по воротам</option><option value="bomb">Прицельный залп</option><option value="roof">Залп на крыше</option><option value="pulse">Удар по стене</option><option value="open">Ядро открыто</option><option value="dead">Босс сбит, мелочь осталась</option><option value="lineup">Все враги в ряд</option><option value="bosses">Все боссы в ряд</option><option value="ram">Таран: разбег</option><option value="stomp">Таран: топот</option><option value="golem">Валун: камень</option><option value="quake">Валун: землетрясение</option><option value="landing">Десант с моря</option></select></label>
      <label>Фаза <select id="stage"><option value="1">1 · Обычный</option><option value="2" selected>2 · Ярость (≤ 50 %)</option></select></label>
      <label>Интерфейс <select id="ui"><option value="boss">Бой с боссом</option><option value="down">Повален в бою с боссом</option><option value="fight">Бой: волна, тревога, стрелки</option><option value="break">Передышка перед боссом</option><option value="kraken">Супер-босс Кракен</option><option value="gate">Ворота пали</option><option value="coach">Новичок: первая игра</option><option value="win">Итоги: устояла</option><option value="lose">Итоги: пала</option></select></label>
      <label>Качество <select id="quality"><option value="low">Низкое</option><option value="medium">Среднее</option><option value="high" selected>Высокое</option></select></label>
      <label><span>Автоцикл: замах → ядро</span><input type="checkbox" id="cycle" /></label>
      <button id="reset" type="button">Камера со стены</button><button id="shop" type="button">Показать лавку</button>
      <output id="metrics"></output>
    </aside>
    <!-- Vite-only preview, consistent with tools/race-preview. Not included in the production build. -->
    <script type="module" src="/client/fort/preview.ts"></script>
  </body>
</html>
