<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Окно автомата — стенд</title>
  <style>
    html, body { margin: 0; height: 100%; background: linear-gradient(180deg, #8fc7e8, #e8d6b0); font-family: Rubik, system-ui, sans-serif; }
    #hud { position: fixed; inset: 0; }
    #ctl { position: fixed; left: 8px; bottom: 8px; display: flex; gap: 6px; flex-wrap: wrap; z-index: 99; }
    #ctl button { font: 12px system-ui; padding: 4px 8px; }
  </style>
</head>
<body>
  <div id="hud"></div>
  <div id="ctl">
    <button data-s="playing">играет + очередь</button>
    <button data-s="idle">тишина</button>
    <button data-s="soon">скоро начнётся</button>
    <button data-s="mine">моя в очереди</button>
    <button data-s="full">очередь полная</button>
    <button data-s="poor">нет жетонов</button>
    <button data-s="pending">ждём ответа</button>
  </div>
  <script type="module" src="./lab.ts"></script>
</body>
</html>
