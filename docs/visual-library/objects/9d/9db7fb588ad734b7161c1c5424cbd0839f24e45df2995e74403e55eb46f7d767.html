<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>im tired</title>
<meta name="description" content="im tired">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<meta property="og:title" content="im tired">
<meta property="og:type" content="website">
<meta property="og:url" content="https://tired.solutions/">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23000'/%3E%3Crect x='4' y='11' width='8' height='2' fill='%23fff'/%3E%3C/svg%3E">
<script>document.documentElement.classList.add('js')</script>
<style>
  :root {
    --bg: #000;
    --fg: #fff;
    --red: #ff2a55;
    --cyan: #27e1ff;
    --p: 1;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; background: var(--bg); overflow: hidden; }

  body {
    display: grid;
    place-items: center;
    color: var(--fg);
    font: 400 clamp(12px, 0.45vw + 8px, 15px) / 1 ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    -webkit-font-smoothing: antialiased;
  }

  ::selection { background: var(--fg); color: var(--bg); }

  /* ---------- text ---------- */

  .stage { position: relative; z-index: 1; }

  .word {
    position: relative;
    font: inherit;
    letter-spacing: 0.35em;
    padding-left: 0.35em; /* balances trailing letter-spacing so the text sits dead centre */
    text-shadow: 0 0 10px rgba(255, 255, 255, 0.28);
    will-change: transform, opacity;
  }

  .txt { position: relative; display: inline-block; white-space: pre; }

  .txt::before,
  .txt::after {
    content: attr(data-text);
    position: absolute;
    inset: 0;
    opacity: 0;
    mix-blend-mode: screen;
    text-shadow: none;
    pointer-events: none;
  }
  .txt::before { color: var(--red); }
  .txt::after  { color: var(--cyan); }

  .cur {
    position: absolute;
    left: 100%;
    top: 0;
    animation: blink 1.2s steps(1) infinite;
  }
  .js .cur { opacity: 0; animation: none; }
  .js.ready .cur { opacity: 1; animation: blink 1.2s steps(1) infinite; }

  @keyframes blink { 50% { opacity: 0; } }

  /* glitch burst: toggled from JS */
  .glitch .word { transform: translate(var(--gx, 0), var(--gy, 0)); }
  .glitch .txt::before { opacity: 0.9; animation: split-a 0.26s steps(1) infinite; }
  .glitch .txt::after  { opacity: 0.9; animation: split-b 0.26s steps(1) infinite; }

  @keyframes split-a {
    0%   { clip-path: inset(10% 0 60% 0); transform: translate(calc(var(--p) * -2px), 0); }
    25%  { clip-path: inset(62% 0 8% 0);  transform: translate(calc(var(--p) * 3px), 0); }
    50%  { clip-path: inset(30% 0 42% 0); transform: translate(calc(var(--p) * -4px), 0); }
    75%  { clip-path: inset(80% 0 2% 0);  transform: translate(calc(var(--p) * 1px), 0); }
    100% { clip-path: inset(4% 0 78% 0);  transform: translate(calc(var(--p) * -1px), 0); }
  }
  @keyframes split-b {
    0%   { clip-path: inset(55% 0 20% 0); transform: translate(calc(var(--p) * 2px), 0); }
    25%  { clip-path: inset(4% 0 70% 0);  transform: translate(calc(var(--p) * -3px), 0); }
    50%  { clip-path: inset(70% 0 10% 0); transform: translate(calc(var(--p) * 3px), 0); }
    75%  { clip-path: inset(20% 0 56% 0); transform: translate(calc(var(--p) * -2px), 0); }
    100% { clip-path: inset(40% 0 36% 0); transform: translate(calc(var(--p) * 1px), 0); }
  }

  /* ---------- social links ---------- */

  /* hangs under the word, so the word itself stays dead centre */
  .links {
    position: absolute;
    top: 100%;
    left: 50%;
    display: flex;
    gap: 1em;
    margin-top: 1.9em;
    transform: translateX(-50%);
  }

  .link {
    position: relative;
    display: block;
    padding: 0.6em;
    color: var(--fg);
    opacity: 0.55;
    outline: none;
    -webkit-tap-highlight-color: transparent;
    transition: opacity 0.15s;
  }
  .link:hover, .link:focus-visible, .link.hot { opacity: 1; }
  .link:focus-visible { outline: 1px dashed rgba(255, 255, 255, 0.35); outline-offset: 1px; }
  .js .link:not(.on) { opacity: 0; pointer-events: none; }

  /* fingers: bigger hit area, same look (padding grows, gap and offset shrink to match) */
  @media (pointer: coarse) {
    .links { gap: 0.2em; margin-top: 1.5em; }
    .link { padding: 1em; }
  }

  .ico { position: relative; display: block; width: 1.45em; height: 1.45em; }
  .ico svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    overflow: visible;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.6;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .ico .m { filter: drop-shadow(0 0 5px rgba(255, 255, 255, 0.35)); }
  .ico .r, .ico .c { opacity: 0; mix-blend-mode: screen; }
  .ico .r { color: var(--red); }
  .ico .c { color: var(--cyan); }

  /* hovered: steady colour fringe */
  .link.hot .ico .r { opacity: 0.75; transform: translate(-1px, 0); }
  .link.hot .ico .c { opacity: 0.75; transform: translate(1px, 0); }

  /* glitch: shared bursts (.glitch-links) and per-icon zaps (.zap), both from JS */
  .glitch-links .link.on .ico, .link.zap .ico { transform: translate(var(--lx, 0), var(--ly, 0)); }
  .glitch-links .link.on .ico .r, .link.zap .ico .r { opacity: 0.9; animation: split-a 0.26s steps(1) infinite; }
  .glitch-links .link.on .ico .c, .link.zap .ico .c { opacity: 0.9; animation: split-b 0.26s steps(1) infinite; }

  /* centred under its own icon */
  .handle {
    position: absolute;
    top: 100%;
    left: 50%;
    margin-top: 0.3em;
    padding-left: 0.2em;
    font-size: 0.82em;
    letter-spacing: 0.2em;
    white-space: pre;
    opacity: 0.75;
    text-shadow: 0 0 8px rgba(255, 255, 255, 0.25);
    transform: translateX(-50%);
    pointer-events: none;
  }

  /* ---------- screen fx ---------- */

  .fx { position: fixed; pointer-events: none; }

  .slices { inset: 0; z-index: 2; }
  .slice { position: absolute; display: block; background: var(--fg); }
  .slice.band { background: var(--noise, none) 0 0 / 200px 200px; }

  /* film grain: one noise tile, jumped around at ~10 fps */
  .grain {
    top: -100%;
    left: -100%;
    width: 300%;
    height: 300%;
    z-index: 3;
    opacity: 0.045;
    background: var(--noise, none) 0 0 / 200px 200px;
    animation: grain 0.9s steps(1) infinite;
  }
  @keyframes grain {
    0%   { transform: translate(0, 0); }
    10%  { transform: translate(-5%, -10%); }
    20%  { transform: translate(-15%, 5%); }
    30%  { transform: translate(7%, -25%); }
    40%  { transform: translate(-5%, 25%); }
    50%  { transform: translate(-15%, 10%); }
    60%  { transform: translate(15%, 0); }
    70%  { transform: translate(0, 15%); }
    80%  { transform: translate(3%, 22%); }
    90%  { transform: translate(-10%, 10%); }
  }

  /* dark scanlines: invisible on black, they only texture the text */
  .scan {
    inset: 0;
    z-index: 4;
    background: repeating-linear-gradient(to bottom, rgba(0, 0, 0, 0.32) 0 1px, transparent 1px 3px);
  }

  /* slow crt roll bar */
  .roll {
    top: 0;
    left: 0;
    right: 0;
    height: 30vh;
    z-index: 5;
    background: linear-gradient(to bottom, transparent, rgba(255, 255, 255, 0.03) 50%, transparent);
    animation: roll 11s linear infinite;
  }
  @keyframes roll {
    from { transform: translateY(-30vh); }
    to   { transform: translateY(130vh); }
  }

  .vignette {
    inset: 0;
    z-index: 6;
    background: radial-gradient(ellipse at center, transparent 50%, rgba(0, 0, 0, 0.6) 100%);
  }

  @media (prefers-reduced-motion: reduce) {
    .grain, .cur, .js.ready .cur { animation: none; }
    .roll { display: none; }
  }
</style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-tg" viewBox="0 0 24 24"><path d="M21 4 3 11l5.2 2L10 19l3-3.6 4.6 4.2zM8.2 13 18.5 6.6l-7.3 7.2-1.2 5.2"/></symbol>
    <symbol id="i-ig" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="4.8"/><circle cx="12" cy="12" r="3.9"/><circle cx="16.9" cy="7.1" r="0.5" fill="currentColor"/></symbol>
  </svg>

  <main class="stage">
    <h1 class="word" aria-label="im tired"><span class="txt" data-text="im tired" aria-hidden="true">im tired</span><span class="cur" aria-hidden="true">_</span></h1>
    <nav class="links" aria-label="social">
      <a class="link" href="https://t.me/qqtired" target="_blank" rel="noopener noreferrer" aria-label="Telegram @qqtired" data-handle="@qqtired">
        <span class="ico" aria-hidden="true"><svg class="m" viewBox="0 0 24 24"><use href="#i-tg"/></svg><svg class="r" viewBox="0 0 24 24"><use href="#i-tg"/></svg><svg class="c" viewBox="0 0 24 24"><use href="#i-tg"/></svg></span>
        <span class="handle" aria-hidden="true"></span>
      </a>
      <a class="link" href="https://www.instagram.com/lostintired/" target="_blank" rel="noopener noreferrer" aria-label="Instagram @lostintired" data-handle="@lostintired">
        <span class="ico" aria-hidden="true"><svg class="m" viewBox="0 0 24 24"><use href="#i-ig"/></svg><svg class="r" viewBox="0 0 24 24"><use href="#i-ig"/></svg><svg class="c" viewBox="0 0 24 24"><use href="#i-ig"/></svg></span>
        <span class="handle" aria-hidden="true"></span>
      </a>
    </nav>
  </main>

  <div class="fx slices" aria-hidden="true"></div>
  <div class="fx grain" aria-hidden="true"></div>
  <div class="fx scan" aria-hidden="true"></div>
  <div class="fx roll" aria-hidden="true"></div>
  <div class="fx vignette" aria-hidden="true"></div>

<script>
(() => {
  const root = document.documentElement;
  const word = document.querySelector('.word');
  const txt = document.querySelector('.txt');
  const slices = document.querySelector('.slices');
  const nav = document.querySelector('.links');
  const links = [...document.querySelectorAll('.link')];

  const TARGET = 'im tired';
  const GLYPHS = '!<>-_\\/[]{}=+*^?#%&@$01';
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const rand = (a, b) => a + Math.random() * (b - a);
  const pick = s => s[Math.floor(Math.random() * s.length)];
  const later = (fn, ms) => setTimeout(fn, ms);
  const set = s => { txt.textContent = s; txt.dataset.text = s; };

  // Noise tile for grain and glitch bands, generated once.
  try {
    const size = 160;
    const c = document.createElement('canvas');
    c.width = c.height = size;
    const ctx = c.getContext('2d');
    const img = ctx.createImageData(size, size);
    for (let i = 0; i < img.data.length; i += 4) {
      const v = (Math.random() * 256) | 0;
      img.data[i] = img.data[i + 1] = img.data[i + 2] = v;
      img.data[i + 3] = 255;
    }
    ctx.putImageData(img, 0, 0);
    root.style.setProperty('--noise', `url(${c.toDataURL('image/png')})`);
  } catch (e) { /* no grain, still fine */ }

  // ---------- intro: scrambled glyphs settle into the word ----------

  function decode(done) {
    const n = TARGET.length;
    const appear = [...TARGET].map((_, i) => i * 70);
    const settle = appear.map(t => t + rand(350, 900));
    const end = Math.max(...settle);
    const start = performance.now();
    let last = 0;

    const frame = now => {
      const t = now - start;
      if (now - last > 45) {
        last = now;
        set([...TARGET].map((ch, i) => {
          if (ch === ' ' || t < appear[i]) return ' ';
          return t >= settle[i] ? ch : pick(GLYPHS);
        }).join(''));
      }
      if (t < end) requestAnimationFrame(frame);
      else { set(TARGET); done(); }
    };
    requestAnimationFrame(frame);
  }

  // ---------- glitch burst ----------

  let busy = false;

  function slice(p, y) {
    const el = document.createElement('i');
    const s = el.style;
    const r = Math.random();
    const nearText = Math.random() < 0.35;
    s.top = y != null ? `${(y + rand(-10, 10)).toFixed(1)}px`
      : nearText ? `calc(50% + ${rand(-14, 14).toFixed(1)}px)` : `${rand(0, 100).toFixed(1)}%`;

    if (r < 0.45) {            // thin bright line
      el.className = 'slice';
      s.height = Math.random() < 0.7 ? '1px' : '2px';
      s.left = `${rand(-10, 50)}%`;
      s.width = `${rand(20, 100)}%`;
      s.opacity = Math.min(0.5, rand(0.06, 0.28) * p).toFixed(2);
    } else if (r < 0.85) {     // full-width noise band
      el.className = 'slice band';
      s.height = `${rand(2, 10 * p) | 0}px`;
      s.left = '0';
      s.width = '100%';
      s.opacity = rand(0.12, 0.4).toFixed(2);
      s.backgroundPosition = `${rand(0, 200) | 0}px ${rand(0, 200) | 0}px`;
    } else {                   // small noise block
      el.className = 'slice band';
      s.height = `${rand(6, 34) | 0}px`;
      s.left = `${rand(0, 92)}%`;
      s.width = `${rand(3, 18)}%`;
      s.opacity = rand(0.15, 0.45).toFixed(2);
    }
    return el;
  }

  // The icons join in on some bursts, not all, so the screen doesn't get too busy.
  function burst(p = 1, then, withLinks = Math.random() < 0.4) {
    if (busy || document.hidden) { then && then(); return; }
    busy = true;
    const until = performance.now() + rand(140, 340) * (0.6 + 0.4 * p);
    const swapLetters = Math.random() < 0.45;
    root.style.setProperty('--p', p.toFixed(2));
    root.classList.add('glitch');
    root.classList.toggle('glitch-links', withLinks);

    const step = () => {
      word.style.setProperty('--gx', `${(rand(-3, 3) * p).toFixed(1)}px`);
      word.style.setProperty('--gy', `${(rand(-1, 1) * p).toFixed(1)}px`);
      if (withLinks) links.forEach(a => jolt(a, p * 0.8));
      const count = Math.round(rand(1, 2 + 2 * p));
      slices.replaceChildren(...Array.from({ length: count }, () => slice(p)));

      if (swapLetters) {
        const chars = [...TARGET];
        const i = Math.floor(Math.random() * chars.length);
        if (chars[i] !== ' ') chars[i] = pick(GLYPHS);
        set(chars.join(''));
      }

      if (performance.now() < until) later(step, rand(40, 85));
      else {
        root.classList.remove('glitch', 'glitch-links');
        slices.replaceChildren();
        set(TARGET);
        busy = false;
        then && then();
      }
    };
    step();
  }

  function flicker(then) {
    word.animate(
      [{ opacity: 1 }, { opacity: 0.25 }, { opacity: 1 }, { opacity: 0.55 }, { opacity: 1 }],
      { duration: rand(160, 260) }
    ).onfinish = then;
  }

  // Random glitches every few seconds, sometimes a stuttering double hit.
  function loop() {
    later(() => {
      if (Math.random() < 0.25) return flicker(loop);
      burst(rand(0.6, 1.2), () => {
        if (Math.random() < 0.35) later(() => burst(rand(0.4, 0.9), loop), rand(60, 180));
        else loop();
      });
    }, rand(2500, 7000));
  }

  // Now and then the word slowly nods off (the icons with it), then jolts awake.
  function doze() {
    later(() => {
      if (document.hidden) return doze();
      const timing = { duration: rand(3200, 4200), easing: 'cubic-bezier(.45,0,.85,1)', fill: 'forwards' };
      const fade = el => el.animate([{ opacity: 1 }, { opacity: 0.08, offset: 0.8 }, { opacity: 0.08 }], timing);
      const a = fade(word);
      const b = fade(nav);
      a.onfinish = () => { a.cancel(); b.cancel(); burst(1.7, null, true); doze(); };
    }, rand(18000, 30000));
  }

  // ---------- social links ----------

  function jolt(a, p) {
    a.style.setProperty('--lx', `${(rand(-3, 3) * p).toFixed(1)}px`);
    a.style.setProperty('--ly', `${(rand(-1.5, 1.5) * p).toFixed(1)}px`);
  }

  // A glitch on one icon only, with a few noise lines running through it.
  function zap(a, p) {
    if (a.classList.contains('zap') || document.hidden) return;
    a.style.setProperty('--p', p.toFixed(2));
    a.classList.add('zap');
    const box = a.querySelector('.ico').getBoundingClientRect();
    const y = box.top + box.height / 2;
    const until = performance.now() + rand(200, 340);
    let own = [];

    const step = () => {
      jolt(a, p);
      own.forEach(el => el.remove());
      own = Math.random() < 0.7 ? Array.from({ length: Math.round(rand(1, 2)) }, () => slice(p, y)) : [];
      slices.append(...own);
      if (performance.now() < until) later(step, rand(40, 85));
      else {
        own.forEach(el => el.remove());
        a.classList.remove('zap');
      }
    };
    step();
  }

  // The handle types itself in out of random glyphs, like the word does.
  // Unrevealed letters are spaces, so the centred label never changes width.
  function typeIn(el, text) {
    const run = (el.run = {});
    const appear = [...text].map((_, i) => i * 35);
    const settle = appear.map(t => t + rand(120, 360));
    const end = Math.max(...settle);
    const start = performance.now();
    let last = 0;

    const frame = now => {
      if (el.run !== run) return;
      const t = now - start;
      if (now - last > 40) {
        last = now;
        el.textContent = [...text].map((ch, i) =>
          t < appear[i] ? ' ' : t >= settle[i] ? ch : pick(GLYPHS)).join('');
      }
      if (t < end) requestAnimationFrame(frame);
      else el.textContent = text;
    };
    requestAnimationFrame(frame);
  }

  // ...and eats itself from the right on the way out.
  function typeOut(el) {
    const run = (el.run = {});
    const chars = [...el.textContent];
    let n = chars.length;

    const tick = () => {
      if (el.run !== run) return;
      n -= 1;
      if (n < 0) { el.textContent = ''; return; }
      el.textContent = chars.map((ch, i) => i < n - 1 ? ch : i <= n ? pick(GLYPHS) : ' ').join('');
      later(tick, 22);
    };
    tick();
  }

  // Hover or keyboard focus lights an icon up and shows its handle.
  links.forEach(a => {
    const handle = a.querySelector('.handle');
    let hover = false, focus = false, hot = false;

    const sync = () => {
      if ((hover || focus) === hot) return;
      hot = hover || focus;
      a.classList.toggle('hot', hot);
      if (reduce) handle.textContent = hot ? a.dataset.handle : '';
      else if (hot) { typeIn(handle, a.dataset.handle); zap(a, 1.4); }
      else typeOut(handle);
    };

    a.addEventListener('pointerenter', () => { hover = true; sync(); });
    a.addEventListener('pointerleave', () => { hover = false; sync(); });
    a.addEventListener('focus', () => { focus = a.matches(':focus-visible'); sync(); });
    a.addEventListener('blur', () => { focus = false; sync(); });
    // coming back from the profile tab or via Back: don't leave an icon stuck lit
    window.addEventListener('pageshow', () => { hover = focus = false; sync(); });
  });

  // The icons switch on one after another, like an old screen warming up.
  function powerOn() {
    const steps = [0, 0.8, 0.05, 0.5, 0, 1, 0.55];
    links.forEach((a, i) => later(() => {
      a.classList.add('on');
      a.animate(steps.map(opacity => ({ opacity, easing: 'steps(1)' })), { duration: 520 });
      later(() => zap(a, 1.2), 300);
    }, i * 220));
  }

  if (reduce) {
    root.classList.add('ready');
    links.forEach(a => a.classList.add('on'));
    return;
  }

  set(' '.repeat(TARGET.length));
  later(() => decode(() => {
    root.classList.add('ready');
    later(() => burst(1.3, loop), 250);
    later(powerOn, 700);
    doze();
  }), 500);
})();
</script>
