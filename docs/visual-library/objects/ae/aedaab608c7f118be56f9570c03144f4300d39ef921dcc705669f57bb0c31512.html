<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Крепость · башни</title>
<link rel="icon" href="data:,">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#9fd3ef;color:#2b2230;font:14px Rubik,system-ui,sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
nav{position:fixed;z-index:2;left:12px;top:12px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;max-width:calc(100% - 24px);padding:8px;background:#fff8eccc;border-radius:10px}
button,select,label{font:inherit}
button,select{background:#fff;border:1px solid #b9a58a;border-radius:6px;padding:6px 8px;cursor:pointer}
#note{position:fixed;left:12px;bottom:12px;z-index:2;padding:8px 10px;border-radius:8px;background:#fff8eccc;white-space:pre-line;max-width:calc(100% - 44px);font-size:12px}
body.clean nav,body.clean #note{display:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<nav><b>Башни крепости</b>
<select id="view"></select>
<button id="fire">Выстрел</button><button id="build">Постройка</button><button id="up">Улучшить</button><button id="down">Уровень −</button>
<label><input id="battle" type="checkbox"> бой</label>
<select id="quality"><option value="high">высокое</option><option value="medium">среднее</option><option value="low">низкое</option></select>
<button id="pause">Пауза</button>
</nav>
<div id="note"></div>
<!-- Стенд только для Vite-разработки (как tools/fort-preview и tools/fort-mobs), в сборку не входит. -->
<script type="module" src="./lab.ts"></script>
</body>
</html>
