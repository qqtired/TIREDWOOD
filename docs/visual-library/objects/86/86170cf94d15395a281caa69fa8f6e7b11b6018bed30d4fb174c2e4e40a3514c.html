<script type="module">
// Проверка павильонов gq в three.js с видом игры: всё «как в игре» скопировано из kit/viewer.html (кривая тона,
// рисованный свет, семейства материалов, солнце/небо). Павильоны ставятся в мировые координаты площади по
// manifest-gq.json (center_world + yaw, как node.position/rotation.y в игре), предметы — InstancedMesh по anchor_prop__*,
// лампочки — InstancedMesh по anchor_bulbs_*, вывеска и афиша — холсты на anchor_sign_face / anchor_afisha_face.
// Адрес: gq_viewer.html?p=kursaal,billiards&cam=x,y,z&tgt=x,y,z&fov=40[&prev=0][&col][&sh=30]
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const Q = new URLSearchParams(location.search);
const hud = document.getElementById('hud');

// ------------------------------------------------------------ кривая тона нового вида (копия lookpaint.ts)
const TONE = { exposure: 1.08, shade: [0.92, 0.96, 1.1], light: [1.07, 1.0, 0.88], t0: 0.05, t1: 1.0, sat: 1.42, lift: 0.4 };
const f3 = (v) => `vec3( ${v.map((x) => x.toFixed(4)).join(', ')} )`;
const TONE_GLSL = `
vec3 CustomToneMapping( vec3 color ) {
	const mat3 lookIn = mat3( vec3( 0.59719, 0.07600, 0.02840 ), vec3( 0.35458, 0.90834, 0.13383 ), vec3( 0.04823, 0.01566, 0.83777 ) );
	const mat3 lookOut = mat3( vec3( 1.60475, -0.10208, -0.00327 ), vec3( -0.53108, 1.10813, -0.07276 ), vec3( -0.07367, -0.00605, 1.07602 ) );
	const vec3 lum = vec3( 0.2126, 0.7152, 0.0722 );
	vec3 c = max( color, 0.0 ) * ( toneMappingExposure * ${(TONE.exposure / 0.6).toFixed(5)} );
	float l = dot( c, lum );
	c *= mix( ${f3(TONE.shade)}, ${f3(TONE.light)}, smoothstep( ${TONE.t0.toFixed(4)}, ${TONE.t1.toFixed(4)}, l ) );
	l = dot( c, lum );
	c = max( vec3( l ) + ( c - l ) * ${TONE.sat.toFixed(4)}, 0.0 );
	c = saturate( lookOut * RRTAndODTFit( lookIn * c ) );
	vec3 d = 1.0 - c;
	return c + ${TONE.lift.toFixed(4)} * c * d * d;
}`;
THREE.ShaderChunk.tonemapping_pars_fragment = THREE.ShaderChunk.tonemapping_pars_fragment.replace('vec3 CustomToneMapping( vec3 color ) { return color; }', TONE_GLSL);

// ------------------------------------------------------------ «рисованный» свет (копия lookpaint.ts)
const WRAP = 0.3;
const TERMINATOR = [0.82, 0.9, 1.12];
const PAINT_PARS = `
varying vec3 vLookW;
uniform vec3 uLookShade;
uniform float uLookSunInv;
float lookLit = 0.0;
vec3 lookDirect( float nl, vec3 light ) {
	float w = saturate( ( nl + ${WRAP.toFixed(3)} ) / ${(1 + WRAP).toFixed(3)} );
	lookLit = max( lookLit, saturate( luminance( light ) * uLookSunInv ) * smoothstep( -0.05, 0.35, nl ) );
	return light * ( w * mix( ${f3(TERMINATOR)}, vec3( 1.0 ), smoothstep( 0.0, 0.5, w ) ) );
}
float lookWobble( vec3 p ) {
	return sin( p.x * 0.9 + sin( p.z * 1.3 + p.y * 0.7 ) * 1.7 ) * sin( p.z * 0.8 + sin( p.x * 1.1 - p.y * 0.9 ) * 1.5 + p.y * 0.4 );
}`;
const GRAIN = `
	{
		float lookFar = length( vLookW - cameraPosition );
		if ( lookFar < 260.0 ) {
			vec3 lookK = vec3( 0.075, 0.055, 0.035 ) * lookWobble( vLookW * 0.45 ) * ( 1.0 - smoothstep( 120.0, 260.0, lookFar ) );
			if ( lookFar < 70.0 ) lookK += 0.04 * lookWobble( vLookW * 1.9 + 7.3 ) * ( 1.0 - smoothstep( 25.0, 70.0, lookFar ) );
			diffuseColor.rgb *= 1.0 + lookK;
		}
	}`;
const VERT_POS = `
	{
		vec4 lookWp = vec4( transformed, 1.0 );
		#ifdef USE_INSTANCING
			lookWp = instanceMatrix * lookWp;
		#endif
		vLookW = ( modelMatrix * lookWp ).xyz;
	}`;
const PHYS = 'reflectedLight.directDiffuse += irradiance * BRDF_Lambert( material.diffuseContribution ) * ( 1.0 - F );';
const physical = THREE.ShaderChunk.lights_physical_pars_fragment.replace(PHYS,
  'reflectedLight.directDiffuse += lookDirect( dot( geometryNormal, directLight.direction ), directLight.color ) * BRDF_Lambert( material.diffuseContribution ) * ( 1.0 - F );');
const paintUniforms = { uLookShade: { value: new THREE.Color(0.9, 0.96, 1.22) }, uLookSunInv: { value: 1 } };
function paint(m) {
  if (!m.isMeshStandardMaterial) return m;
  m.onBeforeCompile = (s) => {
    s.vertexShader = s.vertexShader.replace('#include <common>', '#include <common>\nvarying vec3 vLookW;')
      .replace('#include <project_vertex>', `#include <project_vertex>\n${VERT_POS}`);
    Object.assign(s.uniforms, paintUniforms);
    s.fragmentShader = s.fragmentShader.replace('#include <common>', `#include <common>\n${PAINT_PARS}`)
      .replace('#include <lights_physical_pars_fragment>', physical)
      .replace('#include <lights_fragment_end>', '#include <lights_fragment_end>\n\treflectedLight.indirectDiffuse *= mix( uLookShade, vec3( 1.0 ), lookLit );')
      .replace('#include <color_fragment>', `#include <color_fragment>\n${GRAIN}`);
  };
  m.customProgramCacheKey = () => 'look2g';
  return m;
}

// ------------------------------------------------------------ семейства материалов (как подменит игра)
const FAM = new Map();
function famMat(name) {
  let m = FAM.get(name);
  if (m) return m;
  if (name === 'p3_glow') m = new THREE.MeshBasicMaterial({ vertexColors: true, toneMapped: false });
  else m = paint(new THREE.MeshStandardMaterial({ vertexColors: true, roughness: name === 'p3_gloss' ? 0.35 : 0.85, metalness: 0 }));
  m.name = name;
  FAM.set(name, m);
  return m;
}

// ------------------------------------------------------------ сцена, свет как в look.ts
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.CustomToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 2000);

const SUN_ELEV = 0.42;
const sun = new THREE.DirectionalLight(0xffd49a, 3.4);
// солнце игры: EVENING.sunDir из client/render/sky.ts (−1, 0.22, 0.32) — с запада, чуть с юга (моря)
const az = new THREE.Vector3(-1, 0, 0.32).normalize();
const toSun = new THREE.Vector3(az.x * Math.cos(SUN_ELEV), Math.sin(SUN_ELEV), az.z * Math.cos(SUN_ELEV));
const center = new THREE.Vector3(...(Q.get("tgt") || "0,2,0").split(",").map(Number));
sun.position.copy(center).addScaledVector(toSun, 80);
sun.target.position.copy(center);
sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096);
const SH = Number(Q.get("sh") || 30);
Object.assign(sun.shadow.camera, { left: -SH, right: SH, top: SH, bottom: -SH, near: 10, far: 200 });
sun.shadow.bias = -0.0006;
sun.shadow.normalBias = 0.04;
sun.shadow.radius = 3;
scene.add(sun, sun.target, new THREE.HemisphereLight(0xb2c8f4, 0xd2a57c, 1.3));
paintUniforms.uLookSunInv.value = 1.6 / Math.max(0.05, sun.intensity * (0.2126 * sun.color.r + 0.7152 * sun.color.g + 0.0722 * sun.color.b));

// небо: вечерняя палитра набережной (горизонт тёплый, зенит синий)
const sky = new THREE.Mesh(new THREE.SphereGeometry(900, 32, 16), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, toneMapped: false,
  uniforms: { a: { value: new THREE.Color(0xffd9ad) }, b: { value: new THREE.Color(0x9cc4ee) }, c: { value: new THREE.Color(0x4f86d0) } },
  vertexShader: 'varying vec3 p; void main(){ p = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.); }',
  fragmentShader: 'uniform vec3 a,b,c;\nvarying vec3 p;\nvoid main(){\nfloat h = max(p.y, 0.);\nvec3 col = mix(a, b, smoothstep(0., .18, h));\ncol = mix(col, c, smoothstep(.18, .8, h));\ngl_FragColor = vec4(col, 1.);\n#include <colorspace_fragment>\n}',
}));
scene.add(sky);
// плитка площади и море в мировых координатах площади (раскладка v5): набережная z = 22 (юг), суша на восток до x = 92
const deckMat = paint(new THREE.MeshStandardMaterial({ color: 0xd9c6a2, roughness: 0.95 }));
const plane = (w, d, x, z, y, mat) => {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, d).rotateX(-Math.PI / 2), mat);
  m.position.set(x, y, z);
  m.receiveShadow = true;
  scene.add(m);
  return m;
};
plane(400, 222, 0, 8 - 111, 0, deckMat);           // z −214 … 8
plane(292, 14, 92 - 146, 15, 0, deckMat);          // x −200 … 92, z 8 … 22
const seaMat = new THREE.MeshStandardMaterial({ color: 0x2a8796, roughness: 0.18 });
plane(400, 200, 0, 122, -1.25, seaMat);
plane(140, 14, 92 + 70, 15, -1.25, seaMat);
const quayMat = paint(new THREE.MeshStandardMaterial({ color: 0xcdbb98, roughness: 0.9 }));
const wallS = new THREE.Mesh(new THREE.PlaneGeometry(292, 1.25), quayMat);
wallS.position.set(92 - 146, -0.625, 22);
const wallE = new THREE.Mesh(new THREE.PlaneGeometry(14, 1.25).rotateY(Math.PI / 2), quayMat);
wallE.position.set(92, -0.625, 15);
scene.add(wallS, wallE);

// ------------------------------------------------------------ загрузка
const loader = new GLTFLoader();
const load = (url) => new Promise((ok, no) => loader.load(url, ok, () => {}, no));
const MAN = await fetch('/manifest-gq.json').then((r) => r.json());
const kitMan = await fetch('/kit/glb/manifest.json').then((r) => r.json());
const ids = (Q.get('p') || 'kursaal').split(',');
const stat = { static: 0, props: 0, bulbs: 0, perPav: {} };
const anchors = [];
const pavs = [];
for (const id of ids) {
  const e = MAN.pavilions?.[id] || MAN[id];
  if (!e) { console.warn('нет в manifest-gq', id); continue; }
  const node = new THREE.Group();
  node.position.set(e.center_world[0], 0, e.center_world[1]);
  node.rotation.y = e.yaw;
  scene.add(node);
  const g = await load('/' + e.file);
  node.add(g.scene);
  if (Q.get('prev') !== '0') {
    try { node.add((await load(`/source/preview/gq_prev_${id}.glb`)).scene); } catch { /* нет заглушек */ }
  }
  pavs.push({ id, node, g });
}
scene.updateMatrixWorld(true);
for (const { id, node } of pavs) {
  let tris = 0;
  node.traverse((o) => {
    if (o.name.startsWith('anchor_') || o.name.startsWith('col_')) { o.userData.pav = id; anchors.push(o); return; }
    if (!o.isMesh) return;
    o.material = famMat(o.material.name);
    o.castShadow = o.material.name !== 'p3_glow';
    o.receiveShadow = true;
    const t = o.geometry.index ? o.geometry.index.count / 3 : o.geometry.attributes.position.count / 3;
    let p = o; let isStatic = false;
    while (p) { if (p.name.startsWith('static_') || p.name.startsWith('live_')) isStatic = true; p = p.parent; }
    if (isStatic) tris += t;
  });
  stat.perPav[id] = tris;
  stat.static += tris;
}
for (const a of anchors) a.parent.remove(a);

await Promise.all(['900 46px Rubik', '800 44px Rubik', '700 44px Rubik'].map((f) => document.fonts.load(f, 'АБВ abc 123'))).catch(() => {});
// доски «Ретро-парк 2.0»: макет холста прямо на live_board_* (UV 0..1), стрелки часов — 10:10 (rotation.z = +угол по часовой)
function retroSheet(W, H) {
  const c = document.createElement("canvas"); c.width = W; c.height = H;
  const g = c.getContext("2d");
  const rr = (x, y, w, h, r) => { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); };
  g.fillStyle = "#0a3b37"; rr(0, 0, W, H, 48); g.fill();
  g.fillStyle = "#f3e6c9"; rr(4, 4, W - 8, H - 8, 46); g.fill();
  const gr = g.createLinearGradient(0, 0, 0, H); gr.addColorStop(0, "#13675f"); gr.addColorStop(1, "#0d524d");
  g.fillStyle = gr; rr(12, 12, W - 24, H - 24, 40); g.fill();
  g.save(); rr(12, 12, W - 24, H - 24, 40); g.clip();
  for (let x = 12, i = 0; x < W; x += 88, i++) { g.fillStyle = i % 2 ? "#f3e6c9" : "#ff7a5c"; g.fillRect(x, 12, 88, 40); }
  g.restore();
  return { c, g };
}
const NICK = ["#ffb36b", "#a2f0b8", "#c4ccff", "#ffa3b4", "#ffe58c", "#9fe3da"];
const BOARDS = {
  board_honor(W, H) {
    const { c, g } = retroSheet(W, H);
    g.textBaseline = "middle";
    const col = (x0, x1, title, rows) => {
      g.textAlign = "left"; g.fillStyle = "#ffcd4a"; g.font = "900 46px Rubik"; g.fillText(title, x0, 112);
      g.fillStyle = "rgba(255,244,220,.32)"; g.fillRect(x0, 146, x1 - x0, 3);
      rows.forEach(([n, v], i) => {
        const y = 196 + i * 78;
        g.textAlign = "left"; g.fillStyle = i === 0 ? "#ffcd4a" : NICK[(i + 1) % NICK.length]; g.font = "700 44px Rubik";
        g.fillText((i + 1) + ". " + n, x0, y);
        g.textAlign = "right"; g.fillStyle = i === 0 ? "#ffcd4a" : "#fff4dc"; g.font = "800 44px Rubik"; g.fillText(v, x1, y);
      });
    };
    col(60, 482, "БОГАЧИ", [["Саня", "12 480"], ["Петрович", "9 315"], ["Тома", "7 040"], ["Жорик", "5 210"], ["Ира", "3 900"]]);
    col(542, 964, "ПОБЕДИТЕЛИ", [["Тома", "41"], ["Саня", "37"], ["Ира", "22"], ["Лёха", "19"], ["Петрович", "15"]]);
    g.textAlign = "center"; g.fillStyle = "rgba(255,244,220,.76)"; g.font = "700 36px Rubik"; g.fillText("Последний джекпот: Саня +5 000", W / 2, H - 52);
    return c;
  },
  board_online(W, H) {
    const { c, g } = retroSheet(W, H);
    g.textBaseline = "middle";
    const rows = [["Саня", "в игре", 1], ["Тома", "в игре", 1], ["Петрович", "в игре", 1], ["Ира", "5 мин назад", 0], ["Жорик", "40 мин назад", 0], ["Лёха", "2 ч назад", 0], ["Марина", "вчера", 0], ["Вадик", "3 дн. назад", 0]];
    const step = (H - 52 - 30) / rows.length;
    rows.forEach(([n, t, on], i) => {
      const y = 52 + 15 + step * (i + 0.5);
      if (i) { g.fillStyle = "rgba(255,244,220,.13)"; g.fillRect(48, y - step / 2, W - 96, 2); }
      if (on) { g.fillStyle = "#56c07d"; g.beginPath(); g.arc(70, y, 10, 0, 7); g.fill(); }
      g.textAlign = "left"; g.fillStyle = NICK[i % NICK.length]; g.font = "700 44px Rubik"; g.fillText(n, 96, y);
      g.textAlign = "right"; g.fillStyle = on ? "#9eecb6" : "rgba(255,244,220,.76)"; g.font = (on ? "800" : "700") + " 38px Rubik"; g.fillText(t, W - 56, y);
    });
    return c;
  },
};
for (const { node } of pavs) {
  node.traverse((o) => {
    const k = o.name.replace(/^live_/, "");
    if (o.isMesh && BOARDS[k]) {
      const ud = o.userData || {};
      const tex = new THREE.CanvasTexture(BOARDS[k](ud.canvas_w || 1024, ud.canvas_h || 683));
      tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 8;
      o.material = new THREE.MeshBasicMaterial({ map: tex, toneMapped: false });
    }
    if (o.name === "live_clock_hour") o.rotation.z = 2 * Math.PI * (10 + 10 / 60) / 12;
    if (o.name === "live_clock_minute") o.rotation.z = 2 * Math.PI * 10 / 60;
  });
}

// предметы: InstancedMesh по пустышкам anchor_prop__<деталь>__NN
const want = new Map();
for (const a of anchors) {
  const m = /^anchor_prop__(.+?)__\d+$/.exec(a.name);
  if (!m) continue;
  if (!want.has(m[1])) want.set(m[1], []);
  want.get(m[1]).push(a.matrixWorld.clone());
}
const fileOf = (n) => { const k = kitMan.pieces.find((p) => p.name === n); if (k) return '/kit/' + k.file; return MAN.props?.pieces?.[n] ? '/' + MAN.props.file : null; };
const files = [...new Set([...want.keys()].map(fileOf).filter(Boolean))];
const kits = await Promise.all(files.map((f) => load(f)));
for (const k of kits) k.scene.updateMatrixWorld(true);
const inv = new THREE.Matrix4();
const tmp = new THREE.Matrix4();
for (const [name, mats] of want) {
  const node = kits.map((k) => k.scene.getObjectByName(name)).find(Boolean);
  if (!node) { console.warn('нет детали', name); continue; }
  inv.copy(node.matrixWorld).invert();
  node.traverse((o) => {
    if (!o.isMesh) return;
    const rel = new THREE.Matrix4().multiplyMatrices(inv, o.matrixWorld);
    const im = new THREE.InstancedMesh(o.geometry, famMat(o.material.name), mats.length);
    mats.forEach((m, i) => im.setMatrixAt(i, tmp.multiplyMatrices(m, rel)));
    im.castShadow = o.material.name !== 'p3_glow';
    im.receiveShadow = true;
    scene.add(im);
    stat.props += (o.geometry.index ? o.geometry.index.count / 3 : o.geometry.attributes.position.count / 3) * mats.length;
  });
}

// лампочки: один InstancedMesh
const bulbs = anchors.filter((a) => /^anchor_bulbs_\d+$/.test(a.name));
const bulbMesh = new THREE.InstancedMesh(new THREE.IcosahedronGeometry(0.05, 1), new THREE.MeshBasicMaterial({ color: 0xffe3a6, toneMapped: false }), Math.max(1, bulbs.length));
bulbs.forEach((b, i) => bulbMesh.setMatrixAt(i, b.matrixWorld));
bulbMesh.count = bulbs.length;
scene.add(bulbMesh);
stat.bulbs = bulbs.length;

// вывески и афиша: холсты на *_face (масштаб пустышки = половина ширины/высоты поля, +Z — наружу)
await Promise.all([document.fonts.load('900 64px Rubik'), document.fonts.load('700 40px Rubik')]).catch(() => {});
const SIGNS = {
  kursaal: ['АВТОМАТЫ · АРКАДА', 'играют 3 · свободно 5'], cafe: ['КАФЕ «ЧАЙКА»', ''], cardveranda: ['КАРТЫ · ДУРАК · БЛЭКДЖЕК', ''],
  billiards: ['БИЛЬЯРД', 'столов свободно: 2'], honor: ['ДОСКА ПОЧЁТА', ''], online: ['КТО НА НАБЕРЕЖНОЙ', ''], rotunda: ['РОТОНДА · МУЗЫКА', ''], regatta_lookout: ['РЕГАТА', 'смотровая · старт в 18:00'],
};
function faceQuad(a, draw) {
  const s = new THREE.Vector3();
  a.matrixWorld.decompose(new THREE.Vector3(), new THREE.Quaternion(), s);
  const W = 1024, H = Math.max(64, Math.round(W * s.y / s.x));
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  draw(c.getContext('2d'), W, H);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 8;
  const quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), new THREE.MeshBasicMaterial({ map: tex, toneMapped: false, polygonOffset: true, polygonOffsetFactor: -1, polygonOffsetUnits: -2 }));
  quad.matrixAutoUpdate = false;
  quad.matrix.copy(a.matrixWorld);
  scene.add(quad);
}
for (const { id } of pavs) {
  for (const a of anchors.filter((x) => x.userData.pav === id && /_face(_\d+)?$/.test(x.name))) {
    if (a.name.startsWith('anchor_sign_face')) {
      const [title, sub] = SIGNS[id] || [id.toUpperCase(), ''];
      const retro = id === 'honor' || id === 'online';
      faceQuad(a, (g2, W, H) => {
        if (retro) {
          const gr = g2.createLinearGradient(0, 0, 0, H); gr.addColorStop(0, '#13675f'); gr.addColorStop(1, '#0d524d');
          g2.fillStyle = gr; g2.fillRect(0, 0, W, H);
          g2.fillStyle = '#0a3b37'; g2.textAlign = 'center'; g2.textBaseline = 'middle';
          const fs = Math.min(H * 0.62, W / (title.length * 0.74));
          g2.font = `900 ${Math.round(fs)}px Rubik, sans-serif`;
          g2.fillText(title, W / 2, H / 2 + fs * 0.08);
          g2.fillStyle = '#fff4dc'; g2.fillText(title, W / 2, H / 2);
          return;
        }
        g2.fillStyle = '#fff3de'; g2.fillRect(0, 0, W, H);
        g2.fillStyle = '#2a1f24'; g2.textAlign = 'center';
        const big = Math.min(H * 0.5, W / (title.length * 0.78));
        g2.font = `900 ${Math.round(big)}px Rubik, sans-serif`;
        g2.fillText(title, W / 2, H * (sub ? 0.56 : 0.66));
        if (sub) { g2.fillStyle = '#c0413a'; g2.font = `700 ${Math.round(Math.min(H * 0.2, big * 0.42))}px Rubik, sans-serif`; g2.fillText(sub, W / 2, H * 0.84); }
      });
    } else if (a.name.startsWith('anchor_afisha_face')) {
      faceQuad(a, (g2, W, H) => {
        g2.fillStyle = '#2f4a3c'; g2.fillRect(0, 0, W, H);
        g2.fillStyle = '#f4efe2'; g2.textAlign = 'left';
        g2.font = `900 ${Math.round(H * 0.11)}px Rubik, sans-serif`;
        g2.fillText('Сегодня в городе', W * 0.07, H * 0.17);
        const rows = [['18:00', 'Регата у маяка'], ['19:30', 'Турнир по дураку'], ['21:00', 'Танцы у ротонды'], ['днём', 'Рыбалка на пирсе']];
        g2.font = `700 ${Math.round(H * 0.075)}px Rubik, sans-serif`;
        rows.forEach(([t, s], i) => {
          const y = H * (0.36 + i * 0.16);
          g2.fillStyle = '#f2cf4a'; g2.fillText(t, W * 0.07, y);
          g2.fillStyle = '#f4efe2'; g2.fillText(s, W * 0.33, y);
        });
      });
    }
  }
}
if (Q.has('col')) {
  for (const a of anchors.filter((x) => x.name.startsWith('col_'))) {
    const p = new THREE.Vector3(), q = new THREE.Quaternion(), s = new THREE.Vector3();
    a.matrixWorld.decompose(p, q, s);
    s.set(Math.abs(s.x), Math.abs(s.y), Math.abs(s.z));
    // бокс осевой в GLB; после поворота павильона на кратный 90° угол — переставляем полуразмеры
    const e = new THREE.Vector3(1, 1, 1).multiply(s).applyQuaternion(q);
    e.set(Math.abs(e.x), Math.abs(e.y), Math.abs(e.z));
    scene.add(new THREE.Box3Helper(new THREE.Box3(p.clone().sub(e), p.clone().add(e)), 0xff3366));
  }
}

// ------------------------------------------------------------ камера и кадр
const v3 = (s, d) => (s || d).split(',').map(Number);
camera.position.set(...v3(Q.get('cam'), '30,8,30'));
camera.fov = Number(Q.get('fov') || 40);
camera.updateProjectionMatrix();
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(...v3(Q.get('tgt'), '0,2,0'));
controls.update();
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
let frames = 0;
renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
  if (++frames === 3) {
    const i = renderer.info;
    window.__stats = { calls: i.render.calls, triangles: i.render.triangles, programs: i.programs.length,
      staticTris: stat.static, perPav: stat.perPav, propTris: stat.props, bulbs: stat.bulbs };
    hud.textContent = `${ids.join(' + ')}\nотрисовок за кадр (с тенями): ${i.render.calls}\nтреугольников в кадре: ${i.render.triangles}\n` +
      `статика павильонов: ${stat.static} тр. (${Object.entries(stat.perPav).map(([k, v]) => k + ' ' + v).join(', ')})\n` +
      `предметы инстансами: ${stat.props} тр. · лампочек: ${stat.bulbs}`;
    window.__ready = true;
  }
});
</script>
</body>
</html>
