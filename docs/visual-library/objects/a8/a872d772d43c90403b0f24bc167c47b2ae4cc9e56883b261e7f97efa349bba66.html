#startup *, #startup *::before, #startup *::after { box-sizing: border-box; }

#startup[data-failed] #startup-retry { display: inline-block; }
#startup[data-failed] .s-steps, #startup[data-failed] .s-n, #startup[data-failed] .s-tip { display: none; }
#startup[data-failed] h1 { color: #ff8a8a; font-size: 26px; }
#startup .s-fail { display: none; margin: 8px 0 0; color: rgba(255,243,222,.75); font-size: 18px; }
