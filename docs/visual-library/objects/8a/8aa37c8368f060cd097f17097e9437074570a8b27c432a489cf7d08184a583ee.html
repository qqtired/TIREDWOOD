<script type="module">
// Просмотр павильонов порта и пляжа (pb_*) с видом игры: кривая тона и «рисованный» свет — копия из viewer.html коллег
// (lookpaint.ts), семейства p3_*, предметы по anchor_prop__* (kit/glb и pb_props.glb), лампочки InstancedMesh,
// вывески и доски — холстом на anchor_sign_* / anchor_board_* (в игре их рисует система вывесок).
// Модели стоят на своих местах в мире (./manifest-pb.json: world_origin, yaw), суша — многоугольник из layout.json,
// вода y −1,25, серым — контекст игры (мостки маяка, площадка, маяк, мостик аквапарка).
// Адрес: viewer-pb.html?glb=./pav_semyon.glb[,pav_x.glb] | ?set=1 ; &view=34|above|top|front ; &cam=x,y,z&tgt=x,y,z ; &col ; &fish=sturgeon,salmon,cod (спрайты рыб на anchor_fish_*)
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const Q = new URLSearchParams(location.search);
const hud = document.getElementById('hud');

// ------------------------------------------------------------ кривая тона нового вида (копия lookpaint.ts)
const TONE = { exposure: 1.08, shade: [0.92, 0.96, 1.1], light: [1.07, 1.0, 0.88], t0: 0.05, t1: 1.0, sat: 1.42, lift: 0.4 };
const f3 = (v) => `vec3( ${v.map((x) => x.toFixed(4)).join(', ')} )`;
const TONE_GLSL = `
vec3 CustomToneMapping( vec3 color ) {
	const mat3 lookIn = mat3( vec3( 0.59719, 0.07600, 0.02840 ), vec3( 0.35458, 0.90834, 0.13383 ), vec3( 0.04823, 0.01566, 0.83777 ) );
	const mat3 lookOut = mat3( vec3( 1.60475, -0.10208, -0.00327 ), vec3( -0.53108, 1.10813, -0.07276 ), vec3( -0.07367, -0.00605, 1.07602 ) );
	const vec3 lum = vec3( 0.2126, 0.7152, 0.0722 );
	vec3 c = max( color, 0.0 ) * ( toneMappingExposure * ${(TONE.exposure / 0.6).toFixed(5)} );
	float l = dot( c, lum );
	c *= mix( ${f3(TONE.shade)}, ${f3(TONE.light)}, smoothstep( ${TONE.t0.toFixed(4)}, ${TONE.t1.toFixed(4)}, l ) );
	l = dot( c, lum );
	c = max( vec3( l ) + ( c - l ) * ${TONE.sat.toFixed(4)}, 0.0 );
	c = saturate( lookOut * RRTAndODTFit( lookIn * c ) );
	vec3 d = 1.0 - c;
	return c + ${TONE.lift.toFixed(4)} * c * d * d;
}`;
THREE.ShaderChunk.tonemapping_pars_fragment = THREE.ShaderChunk.tonemapping_pars_fragment.replace('vec3 CustomToneMapping( vec3 color ) { return color; }', TONE_GLSL);

// ------------------------------------------------------------ «рисованный» свет (копия lookpaint.ts)
const WRAP = 0.3;
const TERMINATOR = [0.82, 0.9, 1.12];
const PAINT_PARS = `
varying vec3 vLookW;
uniform vec3 uLookShade;
uniform float uLookSunInv;
float lookLit = 0.0;
vec3 lookDirect( float nl, vec3 light ) {
	float w = saturate( ( nl + ${WRAP.toFixed(3)} ) / ${(1 + WRAP).toFixed(3)} );
	lookLit = max( lookLit, saturate( luminance( light ) * uLookSunInv ) * smoothstep( -0.05, 0.35, nl ) );
	return light * ( w * mix( ${f3(TERMINATOR)}, vec3( 1.0 ), smoothstep( 0.0, 0.5, w ) ) );
}
float lookWobble( vec3 p ) {
	return sin( p.x * 0.9 + sin( p.z * 1.3 + p.y * 0.7 ) * 1.7 ) * sin( p.z * 0.8 + sin( p.x * 1.1 - p.y * 0.9 ) * 1.5 + p.y * 0.4 );
}`;
const GRAIN = `
	{
		float lookFar = length( vLookW - cameraPosition );
		if ( lookFar < 260.0 ) {
			vec3 lookK = vec3( 0.075, 0.055, 0.035 ) * lookWobble( vLookW * 0.45 ) * ( 1.0 - smoothstep( 120.0, 260.0, lookFar ) );
			if ( lookFar < 70.0 ) lookK += 0.04 * lookWobble( vLookW * 1.9 + 7.3 ) * ( 1.0 - smoothstep( 25.0, 70.0, lookFar ) );
			diffuseColor.rgb *= 1.0 + lookK;
		}
	}`;
const VERT_POS = `
	{
		vec4 lookWp = vec4( transformed, 1.0 );
		#ifdef USE_INSTANCING
			lookWp = instanceMatrix * lookWp;
		#endif
		vLookW = ( modelMatrix * lookWp ).xyz;
	}`;
const PHYS = 'reflectedLight.directDiffuse += irradiance * BRDF_Lambert( material.diffuseContribution ) * ( 1.0 - F );';
const physical = THREE.ShaderChunk.lights_physical_pars_fragment.replace(PHYS,
  'reflectedLight.directDiffuse += lookDirect( dot( geometryNormal, directLight.direction ), directLight.color ) * BRDF_Lambert( material.diffuseContribution ) * ( 1.0 - F );');
const paintUniforms = { uLookShade: { value: new THREE.Color(0.9, 0.96, 1.22) }, uLookSunInv: { value: 1 } };
function paint(m) {
  if (!m.isMeshStandardMaterial) return m;
  m.onBeforeCompile = (s) => {
    s.vertexShader = s.vertexShader.replace('#include <common>', '#include <common>\nvarying vec3 vLookW;')
      .replace('#include <project_vertex>', `#include <project_vertex>\n${VERT_POS}`);
    Object.assign(s.uniforms, paintUniforms);
    s.fragmentShader = s.fragmentShader.replace('#include <common>', `#include <common>\n${PAINT_PARS}`)
      .replace('#include <lights_physical_pars_fragment>', physical)
      .replace('#include <lights_fragment_end>', '#include <lights_fragment_end>\n\treflectedLight.indirectDiffuse *= mix( uLookShade, vec3( 1.0 ), lookLit );')
      .replace('#include <color_fragment>', `#include <color_fragment>\n${GRAIN}`);
  };
  m.customProgramCacheKey = () => 'look2g';
  return m;
}

// ------------------------------------------------------------ семейства материалов (как подменит игра)
const FAM = new Map();
function famMat(name) {
  let m = FAM.get(name);
  if (m) return m;
  if (name === 'p3_glow') m = new THREE.MeshBasicMaterial({ vertexColors: true, toneMapped: false });
  else m = paint(new THREE.MeshStandardMaterial({ vertexColors: true, roughness: name === 'p3_gloss' ? 0.35 : 0.85, metalness: 0 }));
  m.name = name;
  FAM.set(name, m);
  return m;
}

// ------------------------------------------------------------ сцена, свет как в look.ts
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.CustomToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(Number(Q.get('fov') || 50), innerWidth / innerHeight, 0.1, 3000);
const SUN_ELEV = 0.42;
const sun = new THREE.DirectionalLight(0xffd49a, 3.4);
const az = new THREE.Vector3(0.55, 0, -0.83).normalize();
const toSun = new THREE.Vector3(az.x * Math.cos(SUN_ELEV), Math.sin(SUN_ELEV), az.z * Math.cos(SUN_ELEV));
sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096);
sun.shadow.bias = -0.0006;
sun.shadow.normalBias = 0.04;
sun.shadow.radius = 3;
scene.add(sun, sun.target, new THREE.HemisphereLight(0xb2c8f4, 0xd2a57c, 1.3));
paintUniforms.uLookSunInv.value = 1.6 / Math.max(0.05, sun.intensity * (0.2126 * sun.color.r + 0.7152 * sun.color.g + 0.0722 * sun.color.b));
const sky = new THREE.Mesh(new THREE.SphereGeometry(1500, 32, 16), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, toneMapped: false,
  uniforms: { a: { value: new THREE.Color(0xffd9ad) }, b: { value: new THREE.Color(0x9cc4ee) }, c: { value: new THREE.Color(0x4f86d0) } },
  vertexShader: 'varying vec3 p; void main(){ p = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.); }',
  fragmentShader: 'uniform vec3 a,b,c;\nvarying vec3 p;\nvoid main(){\nfloat h = max(p.y, 0.);\nvec3 col = mix(a, b, smoothstep(0., .18, h));\ncol = mix(col, c, smoothstep(.18, .8, h));\ngl_FragColor = vec4(col, 1.);\n#include <colorspace_fragment>\n}',
}));
scene.add(sky);

// ------------------------------------------------------------ загрузка
const loader = new GLTFLoader();
const load = (url) => new Promise((ok, no) => loader.load(url, ok, undefined, no));
const [kitMan, myMan, layout] = await Promise.all([
  fetch('/kit/glb/manifest.json').then((r) => r.json()), fetch('./manifest-pb.json').then((r) => r.json()), fetch('/layout/layout.json').then((r) => r.json()),
]);
const PAVS = myMan.pavilions;
const byFile = Object.fromEntries(Object.entries(PAVS).map(([id, p]) => [p.file, { id, ...p }]));
let files = Q.has('set') ? Object.values(PAVS).map((p) => p.file) : (Q.get('glb') || './pav_semyon.glb').split(',');
files = files.filter((f) => byFile[f]);

// кодовый маяк игры (порт tokarev-lighthouse.ts: каждая деталь — отдельная сетка с цветом, без слияния)
function buildCodeLighthouse(x0, z0) {
  const grp = new THREE.Group(); grp.position.set(x0, 0, z0); scene.add(grp);
  const mats = new Map();
  const mat = (c) => { if (!mats.has(c)) mats.set(c, paint(new THREE.MeshStandardMaterial({ color: c, roughness: 0.89, metalness: 0.025 }))); return mats.get(c); };
  const add = (g, c, x, y, z) => { const m = new THREE.Mesh(g, mat(c)); m.position.set(x, y, z); m.castShadow = m.receiveShadow = true; grp.add(m); };
  const white = 0xe9e8df, trim = 0xf5f1df, soot = 0x282d2e, red = 0xcc352c;
  const cylinder = (rt, rb, h, y, c, n = 32) => add(new THREE.CylinderGeometry(rt, rb, h, n).rotateY(n === 8 ? Math.PI / 8 : 0), c, 0, y, 0);
  cylinder(1.54, 1.54, .36, .18, soot, 8); cylinder(1.46, 1.46, 4.05, 2.385, white, 8); cylinder(1.48, 1.46, .14, 4.48, trim, 8);
  cylinder(1.57, 1.48, .16, 4.63, trim, 8); cylinder(1.57, 1.57, .13, 4.775, white, 8); cylinder(1.2, 1.2, 3.76, 6.72, white);
  cylinder(1.24, 1.2, .14, 8.67, trim); cylinder(1.44, 1.24, .18, 8.83, trim); cylinder(1.51, 1.51, .13, 8.985, white); cylinder(1.51, 1.51, .055, 9.077, 0xa5a496);
  add(new THREE.BoxGeometry(.73, 2.24, .085), trim, 0, 1.48, -1.36); add(new THREE.BoxGeometry(.53, 2.04, .035), 0x394442, 0, 1.45, -1.416);
  add(new THREE.BoxGeometry(.027, 1.94, .02), 0x65726b, 0, 1.45, -1.438); add(new THREE.SphereGeometry(.025, 6, 4), 0xc6b689, .17, 1.37, -1.46);
  for (const z of [-1.19, 1.19]) { add(new THREE.BoxGeometry(.57, 1.27, .065), trim, 0, 5.72, z); add(new THREE.BoxGeometry(.4, 1.12, .072), 0x263e43, 0, 5.73, z + Math.sign(z) * .022); add(new THREE.BoxGeometry(.43, .055, .11), 0xb3b8a8, 0, 5.14, z); }
  for (let y = 5.04; y < 8.54; y += .29) cylinder(1.204, 1.204, .007, y, 0xd9d9ce);
  for (let i = 0; i < 28; i++) { const a = i * 2.399963, y = 5.12 + (i % 11) * .3; add(new THREE.BoxGeometry(.055, .018, .012).rotateY(-a), i % 3 ? 0xd8d9cd : 0xf0ede1, Math.sin(a) * 1.204, y, Math.cos(a) * 1.204); }
  for (const y of [9.31, 9.78]) add(new THREE.TorusGeometry(1.43, .025, 5, 40).rotateX(Math.PI / 2), trim, 0, y, 0);
  for (let i = 0; i < 24; i++) { const a = i * Math.PI * 2 / 24; add(new THREE.CylinderGeometry(.018, .018, .69, 5), white, Math.sin(a) * 1.43, 9.435, Math.cos(a) * 1.43); }
  cylinder(.81, .81, .27, 9.235, white, 12); cylinder(.86, .86, .065, 9.405, trim, 12); cylinder(.86, .86, .075, 10.26, trim, 12);
  for (let i = 0; i < 12; i++) { const a = i * Math.PI / 6; add(new THREE.CylinderGeometry(.025, .025, .85, 5), white, Math.sin(a) * .827, 9.82, Math.cos(a) * .827); }
  cylinder(1.02, 1.02, .085, 10.337, red); cylinder(.15, 1.02, .69, 10.725, red); cylinder(.14, .2, .18, 11.16, red, 16);
  add(new THREE.SphereGeometry(.165, 16, 12), red, 0, 11.38, 0); cylinder(.022, .044, .49, 11.735, soot, 8);
  cylinder(.12, .15, .16, 9.185, red, 12); add(new THREE.CylinderGeometry(.095, .115, .36, 10), red, -1.16, 9.38, 0);
  add(new THREE.ConeGeometry(.14, .12, 12), red, -1.16, 9.62, 0); add(new THREE.BoxGeometry(.075, .012, .07), 0xf4ba85, -1.16, 9.48, -.082);
  const glass = new THREE.Mesh(new THREE.CylinderGeometry(.82, .82, .79, 12, 1, true), new THREE.MeshStandardMaterial({ color: 0x72938f, roughness: .18, metalness: .08, transparent: true, opacity: .32, depthWrite: false, side: THREE.DoubleSide }));
  glass.position.y = 9.825; grp.add(glass);
  const lamp = new THREE.Mesh(new THREE.CylinderGeometry(.19, .19, .46, 16), new THREE.MeshBasicMaterial({ color: 0xffe4a2, toneMapped: false })); lamp.position.y = 9.73; grp.add(lamp);
}

// суша (многоугольник layout.json) — плита y 0…−1,4 со стенкой набережной, вода y −1,25
{
  const poly = layout.land.polygon;
  const shape = new THREE.Shape(poly.map(([x, z]) => new THREE.Vector2(x, -z)));
  const g = new THREE.ExtrudeGeometry(shape, { depth: 2.6, bevelEnabled: false, steps: 1 });
  g.rotateX(-Math.PI / 2);
  g.translate(0, -2.6, 0);
  const land = new THREE.Mesh(g, [paint(new THREE.MeshStandardMaterial({ color: 0xdcc9a6, roughness: 0.95 })), paint(new THREE.MeshStandardMaterial({ color: 0xbfb096, roughness: 0.95 }))]);
  land.receiveShadow = true; land.castShadow = true;
  scene.add(land);
  const water = new THREE.Mesh(new THREE.PlaneGeometry(2000, 2000).rotateX(-Math.PI / 2), new THREE.MeshStandardMaterial({ color: 0x2f9db5, roughness: 0.25, metalness: 0.0 }));
  water.position.y = -1.25;
  water.receiveShadow = true;
  scene.add(water);
  // контекст игры (серым, не наше): мостки маяка, площадка, маяк, мостик аквапарка, понтон гидроплана
  const ctxMat = paint(new THREE.MeshStandardMaterial({ color: 0xb9ab95, roughness: 0.9 }));
  const ctxBox = (x0, z0, x1, z1, y0, y1, mat = ctxMat) => {
    const m = new THREE.Mesh(new THREE.BoxGeometry(x1 - x0, y1 - y0, z1 - z0), mat);
    m.position.set((x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2); m.castShadow = m.receiveShadow = true; scene.add(m); return m;
  };
  ctxBox(-21, 22, -17, 38, -0.12, 0);
  ctxBox(-24, 38, -14, 46, -0.4, 0);
  ctxBox(-17, 36, -14, 38, -0.12, 0);
  ctxBox(-34.5, 7.5, -30, 10.5, -0.12, 0);
  if (!files.includes('./pav_lighthouse.glb')) {
    const lh = new THREE.Mesh(new THREE.CylinderGeometry(1.4, 1.9, 12, 16), paint(new THREE.MeshStandardMaterial({ color: 0xf2eee6, roughness: 0.8 })));
    lh.position.set(-19, 6, 43); lh.castShadow = true; scene.add(lh);
    const lt = new THREE.Mesh(new THREE.ConeGeometry(1.6, 1.6, 16), paint(new THREE.MeshStandardMaterial({ color: 0xc9483b, roughness: 0.6 })));
    lt.position.set(-19, 12.8, 43); lt.castShadow = true; scene.add(lt);
  }
  // &cmp=dx — рядом (x −19 + dx) кодовый маяк игры (порт client/lobby/tokarev-lighthouse.ts, те же размеры и цвета)
  if (Q.has('cmp')) buildCodeLighthouse(-19 + Number(Q.get('cmp') || 4.6), 43);
}

// ------------------------------------------------------------ холсты: вывески и доски
await Promise.all([document.fonts.load('900 64px Rubik'), document.fonts.load('700 40px Rubik')]).catch(() => {});
function signTexture(text, w, h, board, sub) {
  const W = 1024, H = Math.max(64, Math.round(W * h / w));
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d');
  if (board) {
    g.fillStyle = '#2c5a42'; g.fillRect(0, 0, W, H);
    g.strokeStyle = '#ffd35a'; g.lineWidth = Math.max(4, H * 0.02); g.strokeRect(8, 8, W - 16, H - 16);
    g.fillStyle = '#fff3de'; let fs = Math.round(Math.min(H * 0.16, 64));
    g.font = `900 ${fs}px Rubik, sans-serif`; g.textAlign = 'center';
    const title = text.split('·')[0].trim();
    g.fillText(title, W / 2, fs * 1.4);
    g.font = `700 ${Math.round(fs * 0.62)}px Rubik, sans-serif`; g.fillStyle = 'rgba(255,243,222,.8)';
    const rows = Math.max(1, Math.floor((H - fs * 2.2) / (fs * 0.85)));
    for (let i = 0; i < Math.min(rows, 6); i++) g.fillText(`${i + 1}.  ············  ${(9 - i) * 3}.${i}`, W / 2, fs * 2.3 + i * fs * 0.85);
  } else {
    g.fillStyle = '#fff3de'; g.fillRect(0, 0, W, H);
    const r = H * 0.36;
    g.fillStyle = '#d9643a'; g.beginPath(); g.arc(H * 0.5, H * 0.5, r, 0, Math.PI * 2); g.fill();
    g.fillStyle = '#fff3de'; g.beginPath(); g.ellipse(H * 0.5, H * 0.5, r * 0.62, r * 0.32, 0, 0, 7); g.fill();
    g.beginPath(); g.moveTo(H * 0.5 - r * 0.55, H * 0.5); g.lineTo(H * 0.5 - r * 0.85, H * 0.5 - r * 0.32); g.lineTo(H * 0.5 - r * 0.85, H * 0.5 + r * 0.32); g.fill();
    g.fillStyle = '#2a1f24';
    let fs = Math.round(H * 0.42);
    g.font = `900 ${fs}px Rubik, sans-serif`;
    while (g.measureText(text).width > W - H * 1.15 && fs > 10) { fs -= 2; g.font = `900 ${fs}px Rubik, sans-serif`; }
    g.textBaseline = 'alphabetic';
    g.fillText(text, H * 1.02, H * 0.56);
    g.fillStyle = '#d9643a'; g.font = `700 ${Math.round(Math.min(fs * 0.5, H * 0.2))}px Rubik, sans-serif`;
    g.fillText(sub || 'открыто · заходи', H * 1.04, H * 0.84);
  }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  return t;
}

const stat = { static: 0, live: 0, props: 0, bulbs: 0 };
const anchors = [];
const roots = [];
const gltfs = await Promise.all(files.map((f) => load(f)));
gltfs.forEach((g, i) => {
  const info = byFile[files[i]];
  const root = new THREE.Group();
  root.position.set(info.world_origin[0], 0, info.world_origin[2]);
  root.rotation.y = info.yaw;
  root.add(g.scene);
  scene.add(root);
  root.updateMatrixWorld(true);
  roots.push({ root, info });
  g.scene.traverse((o) => { if (o.name.startsWith('anchor_') || o.name.startsWith('col_')) anchors.push(o); });
  for (const node of [...g.scene.children]) {
    const isStatic = node.name.startsWith('static_'), isLive = node.name.startsWith('live_');
    if (!isStatic && !isLive) continue;
    node.traverse((o) => {
      if (!o.isMesh) return;
      const n = o.geometry.index ? o.geometry.index.count / 3 : o.geometry.attributes.position.count / 3;
      if (isLive) stat.live += n; else stat.static += n;
      o.material = famMat(o.material.name);
      o.castShadow = o.material.name !== 'p3_glow';
      o.receiveShadow = true;
    });
  }
});
scene.updateMatrixWorld(true);
const amat = new Map(anchors.map((a) => [a, a.matrixWorld.clone()]));
for (const a of anchors) a.parent.remove(a);

// предметы: InstancedMesh по пустышкам
const want = new Map();
for (const a of anchors) {
  const m = /^anchor_prop__(.+?)__\d+$/.exec(a.name);
  if (!m) continue;
  if (!want.has(m[1])) want.set(m[1], []);
  want.get(m[1]).push(amat.get(a));
}
const fileOf = (n) => { const k = kitMan.pieces.find((p) => p.name === n); if (k) return '/kit/' + k.file; if (myMan.props?.pieces?.[n]) return myMan.props.file; return null; };
const pfiles = [...new Set([...want.keys()].map(fileOf).filter(Boolean))];
const kits = await Promise.all(pfiles.map(load));
for (const k of kits) k.scene.updateMatrixWorld(true);
const inv = new THREE.Matrix4(), tmp = new THREE.Matrix4();
for (const [name, mats] of want) {
  const node = kits.map((k) => k.scene.getObjectByName(name)).find(Boolean);
  if (!node) { console.warn('нет детали', name); continue; }
  inv.copy(node.matrixWorld).invert();
  node.traverse((o) => {
    if (!o.isMesh) return;
    const rel = new THREE.Matrix4().multiplyMatrices(inv, o.matrixWorld);
    const im = new THREE.InstancedMesh(o.geometry, famMat(o.material.name), mats.length);
    mats.forEach((m, i) => im.setMatrixAt(i, tmp.multiplyMatrices(m, rel)));
    im.castShadow = o.material.name !== 'p3_glow';
    im.receiveShadow = true;
    scene.add(im);
    stat.props += (o.geometry.index ? o.geometry.index.count / 3 : o.geometry.attributes.position.count / 3) * mats.length;
  });
}

// лампочки: один InstancedMesh
const bulbs = anchors.filter((a) => /^anchor_bulbs(__.+)?_\d+$/.test(a.name));
if (bulbs.length) {
  const bulbMesh = new THREE.InstancedMesh(new THREE.IcosahedronGeometry(0.05, 1), new THREE.MeshBasicMaterial({ color: 0xffe3a6, toneMapped: false }), bulbs.length);
  bulbs.forEach((b, i) => bulbMesh.setMatrixAt(i, amat.get(b)));
  scene.add(bulbMesh);
}
stat.bulbs = bulbs.length;

// вывески и доски: холст на поле (масштаб пустышки = половины поля)
for (const face of anchors.filter((a) => /^anchor_(sign|board)_/.test(a.name))) {
  const s = new THREE.Vector3();
  const M = amat.get(face);
  M.decompose(new THREE.Vector3(), new THREE.Quaternion(), s);
  const board = face.name.startsWith('anchor_board_');
  const text = face.userData?.text || face.name.replace(/^anchor_(sign|board)_/, '').toUpperCase();
  const quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), new THREE.MeshBasicMaterial({ map: signTexture(text, s.x, s.y, board, face.userData?.sub), toneMapped: false, polygonOffset: true, polygonOffsetFactor: -1, polygonOffsetUnits: -2 }));
  quad.matrixAutoUpdate = false;
  quad.matrix.copy(M);
  scene.add(quad);
}

// таблички-ценники anchor_tag_* (в игре — имя рыбака и вес): здесь образец
const TAG_DEMO = [['Саня', '31,2 кг'], ['Дед Семён', '18,7 кг'], ['Tester7', '12,4 кг']];
function tagTexture(rank, w, h) {
  const W = 512, H = Math.round(W * h / w);
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d');
  g.fillStyle = '#fff3de'; g.fillRect(0, 0, W, H);
  g.strokeStyle = '#2a1f24'; g.lineWidth = 8; g.strokeRect(10, 10, W - 20, H - 20);
  const medal = ['#e2a92c', '#9fb0b8', '#c07a43'][rank - 1] || '#9fb0b8';
  const r = H * 0.3;
  g.fillStyle = medal; g.beginPath(); g.arc(H * 0.48, H * 0.5, r, 0, 7); g.fill();
  g.fillStyle = '#2a1f24'; g.font = `900 ${Math.round(r * 1.2)}px Rubik, sans-serif`; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText(String(rank), H * 0.48, H * 0.53);
  const [name, kg] = TAG_DEMO[rank - 1] || TAG_DEMO[0];
  g.textAlign = 'left'; g.textBaseline = 'alphabetic';
  let fs = Math.round(H * 0.3); g.font = `900 ${fs}px Rubik, sans-serif`;
  while (g.measureText(name).width > W - H * 1.0 - 24 && fs > 12) { fs -= 2; g.font = `900 ${fs}px Rubik, sans-serif`; }
  g.fillText(name, H * 0.92, H * 0.47);
  g.fillStyle = '#d9643a'; g.font = `900 ${Math.round(H * 0.27)}px Rubik, sans-serif`;
  g.fillText(kg, H * 0.92, H * 0.8);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  return t;
}
for (const face of anchors.filter((a) => /^anchor_tag_\d+$/.test(a.name))) {
  const s = new THREE.Vector3();
  const M = amat.get(face);
  M.decompose(new THREE.Vector3(), new THREE.Quaternion(), s);
  const rank = Number(face.userData?.rank || face.name.slice(-1));
  const quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), new THREE.MeshBasicMaterial({ map: tagTexture(rank, s.x, s.y), toneMapped: false, polygonOffset: true, polygonOffsetFactor: -1, polygonOffsetUnits: -2 }));
  quad.matrixAutoUpdate = false;
  quad.matrix.copy(M);
  scene.add(quad);
}

// &fish=sturgeon,salmon,cod — временные рыбы-спрайты игры (client/assets/fish) на anchor_fish_1..3: длина = userData.len,
// голова — по userData.head (+X пустышки — влево от зрителя), низ — на точке пустышки. В игре рыб ставит makeFish3D.
if (Q.get('fish')) {
  const names = Q.get('fish').split(',');
  const tl = new THREE.TextureLoader();
  for (const a of anchors.filter((x) => /^anchor_fish_\d+$/.test(x.name))) {
    const k = Number(a.name.slice(-1));
    const name = names[(k - 1) % names.length];
    const tex = await tl.loadAsync(`/fish/${name}.webp`).catch(() => null);
    if (!tex) continue;
    tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 8;
    const len = a.userData?.len || 1.2, head = a.userData?.head || [1, 0, 0];
    const h = len * tex.image.height / tex.image.width;
    const m = new THREE.Mesh(new THREE.PlaneGeometry(len, h), paint(new THREE.MeshStandardMaterial({ map: tex, alphaTest: 0.45, side: THREE.DoubleSide, roughness: 0.45 })));
    m.rotation.y = Math.PI;
    if (head[0] < 0) m.scale.x = -1;
    m.position.y = h * 0.42;
    m.castShadow = true;
    const g = new THREE.Group();
    g.matrixAutoUpdate = false;
    g.matrix.copy(amat.get(a));
    g.add(m);
    scene.add(g);
  }
}

if (Q.has('col')) {
  for (const a of anchors.filter((x) => x.name.startsWith('col_'))) {
    const p = new THREE.Vector3(), q = new THREE.Quaternion(), s = new THREE.Vector3();
    amat.get(a).decompose(p, q, s);
    const e = new THREE.Vector3(Math.abs(s.x), Math.abs(s.y), Math.abs(s.z));
    const v = new THREE.Vector3(1, 1, 1).applyQuaternion(q);
    // боксы осевые: поворот на 90° меняет местами оси
    const ex = new THREE.Vector3(1, 0, 0).applyQuaternion(q), ez = new THREE.Vector3(0, 0, 1).applyQuaternion(q);
    const hx = Math.abs(ex.x) > 0.5 ? e.x : e.z, hz = Math.abs(ez.z) > 0.5 ? e.z : e.x;
    scene.add(new THREE.Box3Helper(new THREE.Box3(new THREE.Vector3(p.x - hx, p.y - e.y, p.z - hz), new THREE.Vector3(p.x + hx, p.y + e.y, p.z + hz)), 0xff3366));
  }
}

// ------------------------------------------------------------ кадр и тени — по габаритам загруженных моделей
const bb = new THREE.Box3();
for (const { root } of roots) root.traverse((o) => { if (o.isMesh) bb.expandByObject(o); });
const ctr = bb.getCenter(new THREE.Vector3()), size = bb.getSize(new THREE.Vector3());
const R = Math.max(4, size.length() / 2);
sun.position.copy(ctr).addScaledVector(toSun, R * 3 + 40);
sun.target.position.copy(ctr);
Object.assign(sun.shadow.camera, { left: -R * 1.2, right: R * 1.2, top: R * 1.2, bottom: -R * 1.2, near: 1, far: R * 6 + 80 });
sun.shadow.camera.updateProjectionMatrix();

const view = Q.get('view') || (Q.has('set') ? 'above' : '34');
const fov = THREE.MathUtils.degToRad(camera.fov);
const fit = (R * 1.02) / Math.sin(Math.min(fov, fov * camera.aspect) / 2);
const yaw = roots.length === 1 ? roots[0].info.yaw : 0;
const rot = (ox, oz) => [ox * Math.cos(yaw) + oz * Math.sin(yaw), -ox * Math.sin(yaw) + oz * Math.cos(yaw)];
const k = Number(Q.get('k') || 0.88);
let cp, ct;
if (view === 'top') { cp = [ctr.x + 0.01, ctr.y + fit * 1.1, ctr.z + 0.01]; ct = [ctr.x, 0, ctr.z]; }
else if (view === 'above') { const [ox, oz] = rot(-0.5 * fit, -0.75 * fit); cp = [ctr.x + ox * k, ctr.y + fit * 0.6 * k, ctr.z + oz * k]; ct = [ctr.x, ctr.y * 0.6, ctr.z]; }
else if (view === 'front') { const [ox, oz] = rot(0, -0.95 * fit * k); cp = [ctr.x + ox, 1.7, ctr.z + oz]; ct = [ctr.x, Math.min(ctr.y, size.y * 0.42), ctr.z]; }
else { const [ox, oz] = rot(-0.55 * fit * k, -0.85 * fit * k); cp = [ctr.x + ox, Math.max(2.2, size.y * 0.35), ctr.z + oz]; ct = [ctr.x, size.y * 0.38, ctr.z]; }
if (Q.get('cam')) cp = Q.get('cam').split(',').map(Number);
if (Q.get('tgt')) ct = Q.get('tgt').split(',').map(Number);
camera.position.set(...cp);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(...ct);
controls.update();
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
let frames = 0;
renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
  if (++frames === 3) {
    const i = renderer.info;
    window.__stats = { files, calls: i.render.calls, triangles: i.render.triangles, programs: i.programs.length,
      staticTris: stat.static, liveTris: stat.live, propTris: stat.props, bulbs: stat.bulbs };
    hud.textContent = `${files.length === 1 ? files[0] : files.length + ' моделей порта и пляжа'}\nотрисовок за кадр (с тенями): ${i.render.calls}\n` +
      `треугольников в кадре: ${i.render.triangles}\nстатика: ${stat.static} тр. · live: ${stat.live} тр.\n` +
      `предметы инстансами: ${stat.props} тр. · лампочек: ${stat.bulbs}`;
    window.__ready = true;
  }
});
</script>
</body>
</html>
