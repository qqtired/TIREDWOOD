# игра: Game Opus — статика из сборки + WebSocket-сервер игры (systemd: game-opus, 127.0.0.1:5190)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name game.tired.solutions;
    server_tokens off;
    charset utf-8;

    include snippets/tired-tls.conf;
    add_header Cache-Control "no-cache" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' wss://game.tired.solutions; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

    root /opt/game-opus/current/dist;
    index index.html;
    # рядом с файлами сборки лежат готовые .gz (deploy/compress.ts)
    gzip_static on;

    # Файлы сборки с хешем в имени не меняются: браузер держит их год.
    location ^~ /assets/ {
        # Nginx 1.24: location add_header replaces the inherited header list.
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location = /ws {
        proxy_pass http://127.0.0.1:5190;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # настоящий адрес игрока — для ограничений частоты (сервер верит ему только с 127.0.0.1)
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_buffering off;
    }

    location = /health {
        proxy_pass http://127.0.0.1:5190;
        proxy_set_header Host $host;
    }

    # Лаборатория идей: страница и API отдаёт сервер игры (LAB=1); без флага — 404. Своя, более строгая CSP.
    location = /lab { return 301 /lab/; }
    location ^~ /lab/ {
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        proxy_pass http://127.0.0.1:5190;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 4k;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
