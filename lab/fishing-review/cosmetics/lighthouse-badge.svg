<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40" stroke-linejoin="round" stroke-linecap="round">
  <!-- Значок у ника «Маяк» (n:lighthouse), по образцу n:anchor из client/ui/fishicons.ts.
       Огонь вспыхивает раз в 6 с (как маяк «Последний свет»). Без анимации — просто горит.
       Фон бутылочно-зелёный, огонь янтарный: сине-жёлтого сочетания нет (AGENTS §7). -->
  <style>
    .beam { opacity: .25; animation: flash 6s ease-out infinite; transform-origin: 20px 12.5px; }
    .lamp { animation: lamp 6s ease-out infinite; }
    @keyframes flash { 0%, 14%, 100% { opacity: .25; transform: scale(.85); } 5% { opacity: 1; transform: scale(1.15); } }
    @keyframes lamp { 0%, 14%, 100% { fill: #f5a64a; } 5% { fill: #fff6d6; } }
    @media (prefers-reduced-motion: reduce) { .beam, .lamp { animation: none; } }
  </style>
  <defs>
    <radialGradient id="g" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff6d6" stop-opacity=".95"/>
      <stop offset=".45" stop-color="#ffb062" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ffb43a" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="c"><circle cx="20" cy="20" r="14.7"/></clipPath>
  </defs>
  <circle cx="20" cy="20" r="16" fill="#1f4a3a" stroke="#e0b030" stroke-width="2.6"/>
  <g clip-path="url(#c)">
    <!-- лучи и ореол -->
    <g class="beam">
      <path d="M20 12.5 3 9.5v6zM20 12.5l17-3v6z" fill="#ffb062" opacity=".55"/>
      <circle cx="20" cy="12.5" r="7" fill="url(#g)"/>
    </g>
    <!-- скала и волна -->
    <path d="M6 33q7-5 14-5t14 5v4H6z" fill="#2f5f4c"/>
    <!-- башня в красно-белую полоску -->
    <path d="M16.6 30 17.9 15.4h4.2L23.4 30z" fill="#f4efe6"/>
    <path d="M17.3 22.6h5.4l.32 3.3h-6.04zM17.75 17.8h4.5l.22 2.4h-4.94z" fill="#d23a2a"/>
    <!-- галерея, фонарная, крыша -->
    <path d="M16.2 14.6h7.6v1.4h-7.6z" fill="#d23a2a"/>
    <rect class="lamp" x="18" y="10.6" width="4" height="4" fill="#f5a64a"/>
    <path d="M17.2 10.8 20 7.6l2.8 3.2z" fill="#d23a2a"/>
    <circle cx="20" cy="7.2" r=".9" fill="#e0b030"/>
  </g>
</svg>
