<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Значок «Маяк»</title>
<style>
  :root { --page: #c4e3f3; --ink: #24313b; --dim: #4f6170; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme='light']) { --page: #1d2226; --ink: #eef1f3; --dim: #a3adb4; } }
  :root[data-theme='dark'] { --page: #1d2226; --ink: #eef1f3; --dim: #a3adb4; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--page); color: var(--ink); font-family: Rubik, system-ui, -apple-system, 'Segoe UI', sans-serif; }
  .page { max-width: 900px; margin: 0 auto; padding: 24px 16px 40px; }
  h1 { font-size: 24px; margin: 0 0 6px; }
  p { color: var(--dim); margin: 0 0 18px; }
  .row { display: flex; flex-wrap: wrap; gap: 18px; align-items: center; }
  figure { margin: 0; display: grid; gap: 6px; justify-items: center; font-size: 13px; color: var(--dim); }
  canvas { width: 320px; height: 80px; image-rendering: auto; background: linear-gradient(#8ccbe6, #6fb6d6); border-radius: 12px; max-width: 100%; }
  .ic { width: 96px; height: 96px; border-radius: 16px; background: rgba(34, 24, 29, 0.88); display: grid; place-items: center; }
  .ic img { width: 72px; height: 72px; }
</style>
</head>
<body>
<div class="page">
  <h1>Значок у ника «Маяк» (n:lighthouse)</h1>
  <p>Часть сета «Смотритель маяка» (все 20 видов острова). Рисуется канвасом в табличке с ником, как золотой якорь
    (client/render/leveltag.ts → drawAnchor). Огонь вспыхивает раз в 6 с; видят все.</p>
  <div class="row">
    <figure><canvas id="lh" width="320" height="80"></canvas><figcaption>новое: маяк</figcaption></figure>
    <figure><canvas id="an" width="320" height="80"></canvas><figcaption>для сравнения: якорь «Хозяина глубин»</figcaption></figure>
    <figure><div class="ic"><img src="lighthouse-badge.svg" alt=""></div><figcaption>значок для журнала (SVG)</figcaption></figure>
  </div>
</div>
<script>
// drawAnchor — копия из client/render/leveltag.ts (для сравнения)
function drawAnchor(ctx, cx, cy, r) {
  ctx.save(); ctx.translate(cx, cy);
  ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2);
  const bg = ctx.createRadialGradient(-r * .3, -r * .35, r * .1, 0, 0, r);
  bg.addColorStop(0, '#2b3f63'); bg.addColorStop(1, '#14213a'); ctx.fillStyle = bg; ctx.fill();
  const gold = ctx.createLinearGradient(-r, -r, r, r);
  gold.addColorStop(0, '#fff1a8'); gold.addColorStop(.45, '#f2c230'); gold.addColorStop(1, '#b07800');
  ctx.strokeStyle = gold; ctx.lineWidth = 2.2; ctx.stroke();
  ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.lineWidth = r * .2; ctx.strokeStyle = gold;
  ctx.beginPath(); ctx.arc(0, -r * .52, r * .17, 0, Math.PI * 2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, -r * .35); ctx.lineTo(0, r * .62); ctx.moveTo(-r * .36, -r * .16); ctx.lineTo(r * .36, -r * .16); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-r * .58, r * .12); ctx.quadraticCurveTo(-r * .5, r * .62, 0, r * .64); ctx.quadraticCurveTo(r * .5, r * .62, r * .58, r * .12); ctx.stroke();
  ctx.fillStyle = gold;
  for (const s of [-1, 1]) { ctx.beginPath(); ctx.moveTo(s * r * .72, r * .2); ctx.lineTo(s * r * .46, r * .04); ctx.lineTo(s * r * .5, r * .3); ctx.closePath(); ctx.fill(); }
  ctx.restore();
}

/**
 * НОВОЕ: маяк у ника. Та же рамка, что у якоря (круг и золотой обод; фон бутылочно-зелёный, а не тёмно-синий — без сине-жёлтого, AGENTS §7), фон бутылочно-зелёный, внутри — башня в красно-белую полоску,
 * фонарь и лучи. glow 0…1 — вспышка (в игре: 1 на ~0,3 с раз в 6 с, перерисовка таблички по ступеням, как shine у рамок).
 */
function drawLighthouse(ctx, cx, cy, r, glow) {
  ctx.save(); ctx.translate(cx, cy);
  ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2);
  const bg = ctx.createRadialGradient(-r * .3, -r * .35, r * .1, 0, 0, r);
  bg.addColorStop(0, '#2c6450'); bg.addColorStop(1, '#16362b'); ctx.fillStyle = bg; ctx.fill();
  const gold = ctx.createLinearGradient(-r, -r, r, r);
  gold.addColorStop(0, '#fff1a8'); gold.addColorStop(.45, '#f2c230'); gold.addColorStop(1, '#b07800');
  ctx.strokeStyle = gold; ctx.lineWidth = 2.2; ctx.stroke();
  ctx.save(); ctx.beginPath(); ctx.arc(0, 0, r - 1.2, 0, Math.PI * 2); ctx.clip();
  // лучи и ореол фонаря
  const ly = -r * .47;
  const a = .25 + .75 * glow;
  ctx.globalAlpha = a * .6; ctx.fillStyle = '#ffb062';
  ctx.beginPath(); ctx.moveTo(0, ly); ctx.lineTo(-r * 1.1, ly - r * .22); ctx.lineTo(-r * 1.1, ly + r * .22); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(0, ly); ctx.lineTo(r * 1.1, ly - r * .22); ctx.lineTo(r * 1.1, ly + r * .22); ctx.closePath(); ctx.fill();
  ctx.globalAlpha = 1;
  const halo = ctx.createRadialGradient(0, ly, 0, 0, ly, r * (.45 + .25 * glow));
  halo.addColorStop(0, `rgba(255,246,214,${.95 * a})`); halo.addColorStop(.45, `rgba(255,170,90,${.55 * a})`); halo.addColorStop(1, 'rgba(255,180,58,0)');
  ctx.fillStyle = halo; ctx.fillRect(-r, -r, 2 * r, 2 * r);
  // скала
  ctx.fillStyle = '#2f5f4c';
  ctx.beginPath(); ctx.moveTo(-r, r * .75); ctx.quadraticCurveTo(0, r * .35, r, r * .75); ctx.lineTo(r, r); ctx.lineTo(-r, r); ctx.fill();
  // башня: белая, две красные полосы
  ctx.fillStyle = '#f4efe6';
  ctx.beginPath(); ctx.moveTo(-r * .21, r * .62); ctx.lineTo(-r * .13, -r * .3); ctx.lineTo(r * .13, -r * .3); ctx.lineTo(r * .21, r * .62); ctx.fill();
  ctx.fillStyle = '#d23a2a';
  ctx.fillRect(-r * .17, r * .16, r * .34, r * .2);
  ctx.fillRect(-r * .145, -r * .14, r * .29, r * .16);
  // галерея, фонарь, крыша
  ctx.fillRect(-r * .24, -r * .36, r * .48, r * .09);
  ctx.fillStyle = glow > .5 ? '#fff1d6' : '#f5a64a';
  ctx.fillRect(-r * .125, -r * .6, r * .25, r * .25);
  ctx.fillStyle = '#d23a2a';
  ctx.beginPath(); ctx.moveTo(-r * .18, -r * .59); ctx.lineTo(0, -r * .8); ctx.lineTo(r * .18, -r * .59); ctx.fill();
  ctx.restore(); ctx.restore();
}

// табличка с ником (упрощённо: уровень без рамки, ник, значок справа — как в drawLevelTag)
function tag(ctx, name, level, badge) {
  const width = 320;
  ctx.clearRect(0, 0, 320, 80);
  ctx.beginPath(); ctx.arc(25, 25, 17, 0, Math.PI * 2); ctx.fillStyle = 'rgba(22,28,32,.94)'; ctx.fill();
  ctx.strokeStyle = '#fff6e8'; ctx.lineWidth = 2; ctx.stroke();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.font = '800 21px Rubik,system-ui,sans-serif'; ctx.fillStyle = '#fff6e8'; ctx.fillText(String(level), 25, 25, 31);
  ctx.font = '700 30px Rubik,system-ui,sans-serif';
  const b = 36;
  const available = width - 62 - b;
  const cx = (width + 44 - b) / 2;
  ctx.lineJoin = 'round'; ctx.lineWidth = 6; ctx.strokeStyle = 'rgba(30,24,20,.85)'; ctx.strokeText(name, cx, 25, available);
  ctx.fillStyle = '#fff6e8'; ctx.fillText(name, cx, 25, available);
  badge(Math.min(width - 20, cx + Math.min(available, ctx.measureText(name).width) / 2 + 20), 25, 15);
}
const lh = document.getElementById('lh').getContext('2d');
const an = document.getElementById('an').getContext('2d');
tag(an, 'Tester7', 23, (x, y, r) => drawAnchor(an, x, y, r));
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
function frame(t) {
  const ph = (t / 1000) % 6;
  const glow = reduce ? 0.6 : Math.exp(-((ph - 0.3) ** 2) / 0.03);
  tag(lh, 'Tester7', 23, (x, y, r) => drawLighthouse(lh, x, y, r, glow));
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
